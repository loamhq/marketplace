name: list
on:
  pull_request:
    paths: ["listings/**", "build.py"]
  push:
    branches: [main]
    paths: ["listings/**", "build.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check the listings
        run: python3 build.py --check
  publish:
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build list.json
        run: |
          python3 build.py
          if ! git diff --quiet list.json; then
            git config user.name "loam-marketplace"
            git config user.email "marketplace@users.noreply.github.com"
            git commit -m "Build list.json" list.json
            git push
          fi
