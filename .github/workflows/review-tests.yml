name: review-tests
on:
  pull_request:
    paths: ["review/**", "build.py"]
  push:
    branches: [main]
    paths: ["review/**", "build.py"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: python3 review/test_review.py
